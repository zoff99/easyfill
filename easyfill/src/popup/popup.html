<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EasyFill</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <svg width="22" height="22" viewBox="0 0 128 128" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#0ea5e9"/>
        </linearGradient>
      </defs>
      <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#g)"/>
      <rect x="26" y="34" width="52" height="12" rx="6" fill="#fff" opacity=".95"/>
      <rect x="26" y="58" width="76" height="12" rx="6" fill="#fff" opacity=".95"/>
      <rect x="26" y="82" width="40" height="12" rx="6" fill="#fff" opacity=".95"/>
      <path d="M78 88 l10 10 l20 -22" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="title">
      <strong>EasyFill</strong>
      <span id="site"></span>
    </div>
  </header>

  <button id="save" class="primary">Save this form</button>
  <p id="status" hidden></p>

  <h2>Saved forms</h2>
  <div id="forms"></div>
  <p id="empty" class="hint" hidden>
    Fill out a form once, then click <strong>Save this form</strong>.<br>
    Next time, fill every field with one click.
  </p>

  <footer>
    <a href="#" id="settings">Settings — values &amp; forms</a>
    <span id="count"></span>
  </footer>

  <script src="../shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
